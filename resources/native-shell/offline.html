<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TUVIO · Offline</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; color: #fff;
            background: radial-gradient(120% 80% at 100% 0%, #6418f5 0%, rgba(100, 24, 245, 0) 60%), radial-gradient(90% 70% at 0% 100%, #ff7ad9 0%, rgba(255, 122, 217, 0) 55%), #0d0a22;
        }
        .mark { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); font-size: 34px; font-weight: 800; }
        h1 { margin-top: 26px; font-size: 26px; letter-spacing: -0.5px; }
        p { margin-top: 10px; max-width: 300px; font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.72); }
        button { margin-top: 28px; padding: 14px 30px; border: 0; border-radius: 999px; background: #fff; color: #0d0a22; font-size: 15px; font-weight: 700; }
        button:active { transform: scale(0.97); }
        small { margin-top: 18px; font-size: 12px; color: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>
    <div class="mark">T</div>
    <h1>You're offline</h1>
    <p>TUVIO needs an internet connection to load events. Tickets you already have are in your email and PDF, and work without data.</p>
    <button type="button" id="retry">Try again</button>
    <small id="status">We'll reconnect automatically.</small>
    <script>
        // Capacitor exposes the configured server URL; fall back to going back to the page that failed.
        function retry() {
            var url = window.WEBVIEW_SERVER_URL;
            if (url && url.indexOf('http') === 0) {
                window.location.replace(url);
            } else {
                window.history.back();
            }
        }
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
    </script>
</body>
</html>
