# Render routes traffic to ${PORT}; Laravel's public/ folder is the document root.
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Fingerprinted build files never change; let browsers and Cloudflare keep them.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ServerSignature Off
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
